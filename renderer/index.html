<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>Claude Code Mascot</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- 起動時オーバーレイ -->
  <div id="overlay">
    <div id="overlay-box">
      <div id="splash-face">( ´ω` )</div>
      <p>作業フォルダを選んで<br>PowerShellを起動します</p>
      <button id="btn-select">フォルダを選択</button>
    </div>
  </div>

  <!-- メイン：マスコット -->
  <div id="app" class="hidden">
    <div id="mascot-face"></div>
    <div id="mascot-state"></div>
    <div id="mascot-message"></div>
    <div id="log-view"></div>
    <div id="footer">
      <span id="cwd-label">—</span>
      <button id="btn-restart">再起動</button>
    </div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
